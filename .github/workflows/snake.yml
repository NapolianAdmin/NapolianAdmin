name: Snake

# Generates the contribution snake animation (light + dark SVG) with Platane/snk
# and pushes the result to a dedicated `output` branch. The README's
# <!-- SNAKE:START --> / <!-- SNAKE:END --> block stays empty until this workflow
# runs for the first time, so nothing renders (and nothing breaks) before then.
#
# This element is a keep/cut candidate for Phase 7 QA. It is fully self-contained:
# removing it later means deleting this file and clearing the SNAKE:START/END pair
# in README.md - nothing else references it.
#
# Targets the default branch. Inert until `main` exists as the default branch.

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:29 UTC (off-peak; a different minute from render-stats).
    - cron: '29 3 * * *'

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate snake SVGs
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark

      # Fail loud: if Platane/snk produced no (or empty) SVGs, stop here rather
      # than publishing an empty `output` branch.
      - name: Verify SVGs were generated
        run: |
          for f in dist/snake-light.svg dist/snake-dark.svg; do
            if [ ! -s "$f" ]; then
              echo "::error::expected $f to exist and be non-empty - snk produced nothing"
              exit 1
            fi
          done
          ls -l dist/

      # Publish to the `output` branch. crazy-max/ghaction-github-pages is the
      # standard Platane/snk pattern: it copes with the root-owned `dist/` that
      # the snk Docker action leaves behind (the hand-rolled `cd dist && git init`
      # push failed with `dist/.git: Permission denied` as the unprivileged
      # runner user).
      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
